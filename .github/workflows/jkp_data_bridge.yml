name: Temporary JKP data bridge

on:
  push:
    branches: [jkp-data-fetch-temp]
    paths:
      - ".github/workflows/jkp_data_bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch official JKP country factor archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p jkp_raw
          BASE="https://jkpfactors-data.s3.amazonaws.com"
          curl -fL --retry 5 --retry-all-errors "$BASE/public/availability.json" -o jkp_raw/availability.json

          python - <<'PY'
          import json, re
          from pathlib import Path
          manifest = json.loads(Path("jkp_raw/availability.json").read_text())
          regions = sorted(
              k for k, selectors in manifest.get("factors", {}).items()
              if re.fullmatch(r"[a-z]{3}", k) and "all_factors" in selectors
          )
          if not (90 <= len(regions) <= 100):
              raise SystemExit(f"Unexpected country count: {len(regions)}")
          Path("jkp_raw/countries.txt").write_text("\n".join(regions) + "\n")
          Path("jkp_raw/source.txt").write_text(
              "Source: Jensen-Kelly-Pedersen Global Factor Data\n"
              "Endpoint: https://jkpfactors-data.s3.amazonaws.com/public/\n"
              "Selector: all_factors\nFrequency: monthly\nWeighting: vw_cap\n"
              "License: CC BY-NC 4.0\n"
          )
          print("country_count=", len(regions))
          print("countries=", ",".join(regions))
          PY

          export BASE
          xargs -a jkp_raw/countries.txt -P 8 -I{} bash -c '
            set -euo pipefail
            country="$1"
            url="$BASE/public/%5B${country}%5D_%5Ball_factors%5D_%5Bmonthly%5D_%5Bvw_cap%5D.zip"
            curl -fL --retry 5 --retry-all-errors "$url" -o "jkp_raw/${country}.zip"
          ' _ {}

      - name: Validate and checksum
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile
          countries=[x.strip() for x in Path("jkp_raw/countries.txt").read_text().splitlines() if x.strip()]
          bad=[]
          for c in countries:
              p=Path(f"jkp_raw/{c}.zip")
              if not p.exists():
                  bad.append((c,"missing"))
                  continue
              try:
                  with zipfile.ZipFile(p) as z:
                      if z.testzip() is not None:
                          bad.append((c,"crc"))
                      if not any(n.lower().endswith(".csv") for n in z.namelist()):
                          bad.append((c,"no_csv"))
              except Exception as e:
                  bad.append((c,repr(e)))
          if bad:
              raise SystemExit(f"Invalid archives: {bad[:20]}")
          print("validated_archives=",len(countries))
          PY
          sha256sum jkp_raw/*.zip > jkp_raw/SHA256SUMS.txt
          du -sh jkp_raw

      - name: Upload JKP artifact
        uses: actions/upload-artifact@v4
        with:
          name: jkp-country-factors-monthly-vwcap
          path: jkp_raw/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
